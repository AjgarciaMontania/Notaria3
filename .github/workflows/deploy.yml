name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ── Paquete de actualización para la APK ─────────────────────────────
      # La APK se trae por internet su parte web y la reemplaza sola, sin
      # reinstalar nada. Por eso aquí se compila TAMBIÉN la interfaz de la APK
      # y se publica junto a la página, en /app/.
      #
      # Lo que se publica son dos archivos:
      #   app/bundle-<commit>.zip  → la interfaz de la APK comprimida
      #   app/manifest.json        → qué versión es y dónde está el zip
      #
      # El nombre del zip lleva el commit para que cada publicación tenga su
      # propio archivo: así el celular nunca se baja uno a medio subir, y se
      # puede volver a una versión anterior con solo reapuntar el manifiesto.
      - name: Instalar dependencias de la APK
        run: npm ci
        working-directory: app-evidencias

      - name: Compilar la interfaz de la APK
        run: npm run build
        working-directory: app-evidencias
        env:
          # Esto es lo que hace que la actualización llegue sola: el commit
          # queda grabado dentro del paquete, y el celular compara el suyo con
          # el del manifiesto. Nadie tiene que acordarse de subir un número.
          GITHUB_SHA: ${{ github.sha }}

      - name: Armar el paquete y el manifiesto
        run: |
          set -euo pipefail
          COMMIT="${{ github.sha }}"
          CORTO="${COMMIT:0:7}"

          # La versión que se muestra en la pantalla de acceso de la APK.
          VERSION=$(grep -oP "VERSION_APP = '\K[^']+" app-evidencias/src/config.js)

          # minNativo: la APK más vieja capaz de correr este paquete. Se toma
          # del versionName con el que se compila el APK. Si el celular tiene
          # una anterior, la aplicación NO se actualiza y avisa que hay que
          # instalar el APK nuevo, en vez de quedar rota y sin arreglo.
          MIN_NATIVO=$(grep -oP 'versionName "\K[^"]+' app-evidencias/android/app/build.gradle)

          mkdir -p dist/app
          (cd app-evidencias/dist && zip -qr "$GITHUB_WORKSPACE/dist/app/bundle-$CORTO.zip" .)

          SHA=$(sha256sum "dist/app/bundle-$CORTO.zip" | cut -d' ' -f1)
          TAMANO=$(stat -c%s "dist/app/bundle-$CORTO.zip")

          cat > dist/app/manifest.json <<JSON
          {
            "version": "$VERSION",
            "commit": "$COMMIT",
            "minNativo": "$MIN_NATIVO",
            "url": "https://ajgarciamontania.github.io/Notaria3/app/bundle-$CORTO.zip",
            "sha256": "$SHA",
            "bytes": $TAMANO
          }
          JSON

          echo "Paquete publicado: bundle-$CORTO.zip ($TAMANO bytes), versión $VERSION, mínimo nativo $MIN_NATIVO"
          cat dist/app/manifest.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4